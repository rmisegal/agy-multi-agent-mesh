[project]
name = "agymesh"
version = "1.11"
description = "Generic session-to-session IPC mesh for Antigravity CLI (agy) sessions"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dr. Yoram Segal, Gal Technologies Artificial Intelligence Ltd." }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agymesh = "agymesh.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agymesh"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that open real sockets or threads"]

[tool.coverage.run]
source = ["src"]
omit = ["src/agymesh/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
